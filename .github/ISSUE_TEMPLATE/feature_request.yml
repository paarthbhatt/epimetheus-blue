name: Feature request
description: Propose a scoped improvement to the experimental release.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Read docs/LIMITATIONS.md for your release and keep requests within the experimental scope.
        Use [private reporting](https://github.com/paarthbhatt/epimetheus-blue/security/advisories/new) for vulnerabilities. Do not include keys, malware samples, browsing history, browser profiles, or unsanitized diagnostics.
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Who needs this, and what is difficult today? Use fictional or sanitized examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and safe defaults
      description: Describe the smallest useful change, how it is explicitly enabled, and expected success/failure behavior.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, privileges, compatibility, and recovery
      description: Note any network data sharing, required privileges/runtime versions, affected paths, rollback, or data-loss risk. Say none or unknown where appropriate.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Existing commands, configuration, or other tools that could meet the need.
  - type: checkboxes
    id: privacy
    attributes:
      label: Reporting safety
      options:
        - label: This is not a public vulnerability disclosure and contains no keys, malware samples, browsing history, or private profile/state data.
          required: true
