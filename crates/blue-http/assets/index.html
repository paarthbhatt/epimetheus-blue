<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Epimetheus Blue</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d13;
    --panel: #11161f;
    --panel-2: #0d1219;
    --line: #1e2733;
    --text: #d7dee8;
    --muted: #7d8b9e;
    --accent: #6fb3ff;
    --ok: #4ad295;
    --warn: #ffb454;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 24px 64px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, "JetBrains Mono", "Fira Code", Menlo, monospace;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    max-width: 1180px;
    margin: 0 auto 24px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .04em;
    margin: 0;
  }
  h1 span { color: var(--accent); }
  #pill {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: .08em;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  #pill.ok { color: var(--ok); border-color: #1d4a37; }
  #pill.degraded { color: var(--warn); border-color: #574019; }
  #pill.unknown { color: var(--muted); }
  .spacer { flex: 1; }
  #version { color: var(--muted); font-size: 12px; }
  main { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .card .value { font-size: 26px; margin-top: 4px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
  }
  section header { margin: 0 0 12px; padding: 0; max-width: none; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--panel-2); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  tbody tr:last-child td { border-bottom: none; }
  td.mono { font-variant-ligatures: none; }
  td.dim, .dim { color: var(--muted); }
  .truncate { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .level-warn { color: var(--warn); }
  .level-error { color: var(--bad); }
  .level-info { color: var(--muted); }
  button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); }
  button.danger { border-color: #5b2222; color: var(--bad); }
  button.danger:hover { border-color: var(--bad); }
  button.armed { background: #3a1414; border-color: var(--bad); }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; }
  input[type=password] {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 8px;
    min-width: 220px;
  }
  #auth { display: none; }
  #auth.on { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #banner {
    display: none;
    border-color: #5b2222;
    color: var(--bad);
  }
  #banner.on { display: block; }
  .empty { color: var(--muted); padding: 8px 2px; }
  footer { max-width: 1180px; margin: 24px auto 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Epimetheus <span>Blue</span></h1>
  <span id="pill" class="unknown">connecting</span>
  <div class="spacer"></div>
  <span id="version"></span>
</header>

<main>
  <div id="banner" class="card"></div>

  <div id="auth">
    <span class="dim">API token</span>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="bearer token">
    <button id="auth-save" type="button">Use token</button>
  </div>

  <div class="cards">
    <div class="card">
      <div class="label">Artifacts</div>
      <div class="value" id="count-artifacts">–</div>
    </div>
    <div class="card">
      <div class="label">In quarantine</div>
      <div class="value" id="count-quarantined">–</div>
    </div>
    <div class="card">
      <div class="label">Kill switch</div>
      <div class="value"><button id="kill" type="button" disabled>–</button></div>
    </div>
  </div>

  <section>
    <header><h2>Recent events</h2></header>
    <table>
      <thead>
        <tr><th>When</th><th>Kind</th><th>Level</th><th>Subject</th><th>Payload</th></tr>
      </thead>
      <tbody id="events"><tr><td colspan="5" class="empty">loading…</td></tr></tbody>
    </table>
  </section>

  <section>
    <header>
      <h2>Quarantine</h2>
      <label class="toggle"><input id="show-all" type="checkbox"> show restored</label>
    </header>
    <table>
      <thead>
        <tr><th>ID</th><th>Original path</th><th>Tier</th><th>Reason</th><th>Stored</th><th></th></tr>
      </thead>
      <tbody id="quarantine"><tr><td colspan="6" class="empty">loading…</td></tr></tbody>
    </table>
  </section>
</main>

<footer>Read-only view. The only actions here are the kill switch and quarantine restore; nothing is ever deleted.</footer>

<script>
(function () {
  "use strict";

  var POLL_MS = 3000;
  var tokenKey = "blue.http.token";
  var token = sessionStorage.getItem(tokenKey) || "";
  var busy = false;

  var el = {
    pill: document.getElementById("pill"),
    version: document.getElementById("version"),
    banner: document.getElementById("banner"),
    auth: document.getElementById("auth"),
    tokenInput: document.getElementById("token"),
    authSave: document.getElementById("auth-save"),
    kill: document.getElementById("kill"),
    artifacts: document.getElementById("count-artifacts"),
    quarantined: document.getElementById("count-quarantined"),
    events: document.getElementById("events"),
    quarantine: document.getElementById("quarantine"),
    showAll: document.getElementById("show-all")
  };

  function text(node, value) {
    node.textContent = value == null ? "" : String(value);
  }

  function makeCell(value, className) {
    var td = document.createElement("td");
    td.textContent = value == null ? "—" : String(value);
    if (className) { td.className = className; }
    return td;
  }

  function when(ms) {
    if (!ms) { return "—"; }
    var d = new Date(Number(ms));
    return isNaN(d.getTime()) ? String(ms) : d.toLocaleString();
  }

  function showBanner(message) {
    el.banner.textContent = message;
    el.banner.classList.add("on");
  }

  function hideBanner() {
    el.banner.classList.remove("on");
    el.banner.textContent = "";
  }

  function showAuth() {
    el.auth.classList.add("on");
    el.tokenInput.focus();
  }

  function api(path, options) {
    var opts = options || {};
    var headers = {};
    if (token) { headers["Authorization"] = "Bearer " + token; }
    if (opts.body) { headers["Content-Type"] = "application/json"; }
    return fetch(path, { method: opts.method || "GET", headers: headers, body: opts.body })
      .then(function (res) {
        if (res.status === 401) {
          showAuth();
          throw new Error("unauthorized: paste the API token above");
        }
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) { throw new Error(data.error || ("HTTP " + res.status)); }
          return data;
        });
      });
  }

  function renderStatus(summary) {
    var degraded = Boolean(summary.kill_switch);
    text(el.pill, degraded ? "degraded" : "ok");
    el.pill.className = degraded ? "degraded" : "ok";
    text(el.artifacts, summary.artifacts);
    text(el.quarantined, summary.quarantined);

    el.kill.disabled = false;
    el.kill.textContent = degraded ? "engaged — resume scanning" : "engage kill switch";
    el.kill.className = degraded ? "danger armed" : "danger";
  }

  function renderEvents(rows) {
    el.events.textContent = "";
    if (!rows.length) {
      var tr = document.createElement("tr");
      var td = makeCell("no events yet", "empty");
      td.colSpan = 5;
      tr.appendChild(td);
      el.events.appendChild(tr);
      return;
    }
    rows.forEach(function (ev) {
      var tr = document.createElement("tr");
      tr.appendChild(makeCell(when(ev.ts_ms), "dim"));
      tr.appendChild(makeCell(ev.kind));
      var level = makeCell(ev.level);
      level.className = "level-" + (ev.level === "warn" || ev.level === "error" ? ev.level : "info");
      tr.appendChild(level);
      tr.appendChild(makeCell(ev.subject || "—", "truncate dim"));
      tr.appendChild(makeCell(ev.payload, "mono truncate dim"));
      el.events.appendChild(tr);
    });
  }

  function renderQuarantine(rows) {
    el.quarantine.textContent = "";
    if (!rows.length) {
      var tr = document.createElement("tr");
      var td = makeCell("nothing held", "empty");
      td.colSpan = 6;
      tr.appendChild(td);
      el.quarantine.appendChild(tr);
      return;
    }
    rows.forEach(function (item) {
      var tr = document.createElement("tr");
      tr.appendChild(makeCell(item.id, "dim"));
      tr.appendChild(makeCell(item.original_path, "truncate"));
      tr.appendChild(makeCell(item.tier));
      tr.appendChild(makeCell(item.reason, "truncate dim"));
      tr.appendChild(makeCell(when(item.created_at_ms), "dim"));

      var actions = document.createElement("td");
      if (item.restored_at_ms) {
        actions.appendChild(makeCell("restored " + when(item.restored_at_ms), "dim"));
      } else {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = "restore";
        button.addEventListener("click", function () {
          button.disabled = true;
          api("/api/quarantine/" + encodeURIComponent(item.id) + "/restore", { method: "POST" })
            .then(function (data) {
              hideBanner();
              button.textContent = "restored";
              void data;
              return refresh();
            })
            .catch(function (e) {
              button.disabled = false;
              showBanner("restore failed: " + e.message);
            });
        });
        actions.appendChild(button);
      }
      tr.appendChild(actions);
      el.quarantine.appendChild(tr);
    });
  }

  function refresh() {
    if (busy) { return Promise.resolve(); }
    busy = true;
    var all = el.showAll.checked ? "?all=true" : "?all=false";
    return Promise.all([
      api("/api/summary"),
      api("/api/quarantine" + all)
    ]).then(function (out) {
      hideBanner();
      renderStatus(out[0]);
      renderEvents(out[0].events || []);
      renderQuarantine(out[1].quarantine || []);
    }).catch(function (e) {
      text(el.pill, "degraded");
      el.pill.className = "degraded";
      showBanner(e.message);
    }).then(function () {
      busy = false;
    });
  }

  el.kill.addEventListener("click", function () {
    var engage = el.kill.textContent.indexOf("resume") === -1;
    el.kill.disabled = true;
    api("/api/killswitch", { method: "POST", body: JSON.stringify({ on: engage }) })
      .then(refresh)
      .catch(function (e) {
        el.kill.disabled = false;
        showBanner("kill switch failed: " + e.message);
      });
  });

  el.showAll.addEventListener("change", refresh);

  el.authSave.addEventListener("click", function () {
    token = el.tokenInput.value.trim();
    if (token) {
      sessionStorage.setItem(tokenKey, token);
    } else {
      sessionStorage.removeItem(tokenKey);
    }
    refresh();
  });

  fetch("/api/health").then(function (res) {
    return res.ok ? res.json() : Promise.reject(new Error("health"));
  }).then(function (data) {
    text(el.version, "v" + data.version);
  }).catch(function () { /* the summary poll reports the real problem */ });

  refresh();
  setInterval(refresh, POLL_MS);
})();
</script>
</body>
</html>
