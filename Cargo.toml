[workspace]
resolver = "2"
members = [
    "crates/blue-core",
    "crates/blue-scan",
    "crates/blue-dns",
    "crates/blue-guard",
    "crates/blue-feeds",
    "crates/blue-reputation",
    "crates/blue-net",
    "crates/blue-native-host",
    "crates/blue-cleanup",
    "crates/blue-ui",
    "crates/blue-bin",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util"] }
blue-core = { path = "crates/blue-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
